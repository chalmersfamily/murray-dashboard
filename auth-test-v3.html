<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Microsoft Sign-In Test v3.41</title>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.25.1/lib/msal-browser.min.js"></script>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:800px;
    margin:auto;
    padding:40px;
}

.card{
    border:1px solid #ccc;
    padding:20px;
    border-radius:10px;
}

button{
    padding:10px 15px;
    margin-right:10px;
}

#output{
    margin-top:20px;
    border-top:1px solid #ddd;
    padding-top:15px;
}
</style>

</head>

<body>

<div class="card">

<h1>Microsoft Sign-In Test v3.41</h1>

<button onclick="signIn()">
    Sign In
</button>

<button onclick="testGraph()">
    Test Graph
</button>
    <button onclick="testCalendar()">
    Calendar
</button>
<button onclick="testTodo()">
    To Do
</button>
<p id="status">
    Initializing...
</p>

<div id="output"></div>

</div>

<script>

let pca = null;
let initialized = false;

const msalConfig = {
    auth: {
        clientId: "7a533e96-1dc4-4f59-98ea-2564c7b4d0e1",
        authority: "https://login.microsoftonline.com/common",
        redirectUri: "https://chalmersfamily.github.io/murray-dashboard/auth-test-v3.html"
    }
};

async function startup() {

    try {

        pca = new msal.PublicClientApplication(
            msalConfig
        );

        await pca.initialize();

        initialized = true;

        document.getElementById("status").innerHTML =
            "Ready for sign in";

    }
    catch(err) {

        console.error(err);

        document.getElementById("status").innerHTML =
            "Startup Error:<br>" + err;
    }
}

async function signIn() {

    if (!initialized) {

        document.getElementById("status").innerHTML =
            "Still initializing";

        return;
    }

    try {

        const result =
            await pca.loginPopup({
                scopes: [
                    "openid",
                    "profile",
                    "User.Read"
                ]
            });

        document.getElementById("status").innerHTML =
            "Signed in as:<br>" +
            result.account.username;

    }
    catch(err) {

        console.error(err);

        document.getElementById("status").innerHTML =
            "Login Error:<br>" + err;
    }
}

async function testGraph() {

    try {

        const accounts =
            pca.getAllAccounts();

        if(accounts.length === 0) {

            document.getElementById("output").innerHTML =
                "Please sign in first.";

            return;
        }

        const tokenResponse =
            await pca.acquireTokenSilent({
                scopes: ["User.Read"],
                account: accounts[0]
            });

        const response =
            await fetch(
                "https://graph.microsoft.com/v1.0/me",
                {
                    headers: {
                        Authorization:
                            "Bearer " +
                            tokenResponse.accessToken
                    }
                }
            );

        const user =
            await response.json();

        document.getElementById("output").innerHTML =
            `
            <h3>Graph Test Success</h3>
            <p><strong>Name:</strong> ${user.displayName}</p>
            <p><strong>Email:</strong> ${user.mail || user.userPrincipalName}</p>
            `;

    }
    catch(err) {

        console.error(err);

        document.getElementById("output").innerHTML =
            "Graph Error:<br>" + err;
    }
}

async function testCalendar() {

    try {

        const accounts = pca.getAllAccounts();

        if (accounts.length === 0) {

            document.getElementById("output").innerHTML =
                "Please sign in first.";

            return;
        }

        let tokenResponse;

        try {

            tokenResponse =
                await pca.acquireTokenSilent({
                    scopes: ["Calendars.Read"],
                    account: accounts[0]
                });

        }
        catch {

            tokenResponse =
                await pca.acquireTokenPopup({
                    scopes: ["Calendars.Read"]
                });
        }

        const now = new Date();

        const nextWeek = new Date();

        nextWeek.setDate(
            now.getDate() + 7
        );

        const response =
            await fetch(
                `https://graph.microsoft.com/v1.0/me/calendarView?startDateTime=${now.toISOString()}&endDateTime=${nextWeek.toISOString()}`,
                {
                    headers: {
                        Authorization:
                            "Bearer " +
                            tokenResponse.accessToken
                    }
                }
            );

        const data =
            await response.json();

        let html =
            "<h3>Upcoming Events (Next 7 Days)</h3>";

        if (!data.value || data.value.length === 0) {

            html +=
                "<p>No upcoming events found.</p>";
        }
        else {

            data.value.forEach(event => {

                const eventDate =
                    new Date(
                        event.start.dateTime
                    );

                const formattedDate =
                    eventDate.toLocaleString(
                        undefined,
                        {
                            weekday: "short",
                            month: "short",
                            day: "numeric",
                            hour: "numeric",
                            minute: "2-digit"
                        }
                    );

                html += `
                    <div style="
                        margin-bottom:12px;
                        padding:8px;
                        border-bottom:1px solid #ddd;
                    ">
                        <strong>
                            ${event.subject}
                        </strong>
                        <br>
                        ${formattedDate}
                    </div>
                `;
            });
        }

        document.getElementById(
            "output"
        ).innerHTML =
            html;
    }
    catch(err) {

        console.error(err);

        document.getElementById(
            "output"
        ).innerHTML =
            "Calendar Error:<br>" +
            err;
    }
}
    async function testTodo() {

    try {

        const accounts =
            pca.getAllAccounts();

        if (accounts.length === 0) {

            document.getElementById("output").innerHTML =
                "Please sign in first.";

            return;
        }

        let tokenResponse;

        try {

            tokenResponse =
                await pca.acquireTokenSilent({
                    scopes: ["Tasks.Read"],
                    account: accounts[0]
                });

        }
        catch {

            tokenResponse =
                await pca.acquireTokenPopup({
                    scopes: ["Tasks.Read"]
                });
        }

        const listsResponse =
            await fetch(
                "https://graph.microsoft.com/v1.0/me/todo/lists",
                {
                    headers: {
                        Authorization:
                            "Bearer " +
                            tokenResponse.accessToken
                    }
                }
            );

        const listsData =
            await listsResponse.json();

        let html =
            "<h3>Microsoft To Do</h3>";

        if (!listsData.value ||
            listsData.value.length === 0) {

            html +=
                "<p>No task lists found.</p>";

            document.getElementById("output").innerHTML =
                html;

            return;
        }

        for (const list of listsData.value) {

            html +=
                `<h4>${list.displayName}</h4>`;

            const tasksResponse =
                await fetch(
                    `https://graph.microsoft.com/v1.0/me/todo/lists/${list.id}/tasks`,
                    {
                        headers: {
                            Authorization:
                                "Bearer " +
                                tokenResponse.accessToken
                        }
                    }
                );

            const tasksData =
                await tasksResponse.json();

            if (!tasksData.value ||
                tasksData.value.length === 0) {

                html +=
                    "<p>No tasks.</p>";

                continue;
            }

            html += "<ul>";

            tasksData.value.forEach(task => {

                const completed =
                    task.status === "completed"
                    ? "✅"
                    : "⬜";

                html +=
                    `<li>${completed} ${task.title}</li>`;
            });

            html += "</ul>";
        }

        document.getElementById(
            "output"
        ).innerHTML =
            html;

    }
    catch(err) {

        console.error(err);

        document.getElementById(
            "output"
        ).innerHTML =
            "To Do Error:<br>" +
            err;
    }
}

startup();

</script>

</body>
</html>
