<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Auth Test v3</title>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.25.1/lib/msal-browser.min.js"></script>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:800px;
    margin:auto;
    padding:40px;
}

.card{
    border:1px solid #ccc;
    padding:20px;
    border-radius:10px;
}

button{
    padding:10px 15px;
}
</style>

</head>

<body>

<div class="card">

<h1>Microsoft Sign-In Test v3</h1>

<button onclick="signIn()">
Sign In
</button>

<p id="status">
Initializing...
</p>

</div>

<script>

let pca = null;
let initialized = false;

const msalConfig = {

    auth: {

        clientId:
        "7a533e96-1dc4-4f59-98ea-2564c7b4d0e1",

        authority:
        "https://login.microsoftonline.com/common",

        redirectUri:
        "https://chalmersfamily.github.io/murray-dashboard/auth-test-v3.html"

    }

};

async function startup(){

    try{

        pca =
            new msal.PublicClientApplication(
                msalConfig
            );

        await pca.initialize();

        initialized = true;

        document.getElementById(
            "status"
        ).innerHTML =
            "Ready for sign in";

    }
    catch(err){

        document.getElementById(
            "status"
        ).innerHTML =
            "Startup Error:<br>" +
            err;

        console.error(err);

    }

}

async function signIn(){

    if(!initialized){

        document.getElementById(
            "status"
        ).innerHTML =
            "Still initializing";

        return;

    }

    try{

        const result =
            await pca.loginPopup({

                scopes:[

                    "openid",
                    "profile",
                    "User.Read"

                ]

            });

        document.getElementById(
            "status"
        ).innerHTML =
            "Signed in as:<br>" +
            result.account.username;

    }
    catch(err){

        document.getElementById(
            "status"
        ).innerHTML =
            err;

        console.error(err);

    }

}

startup();

</script>

</body>
</html>
