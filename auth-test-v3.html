<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Microsoft Sign-In Test v3.11</title>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.25.1/lib/msal-browser.min.js"></script>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:800px;
    margin:auto;
    padding:40px;
}

.card{
    border:1px solid #ccc;
    padding:20px;
    border-radius:10px;
}

button{
    padding:10px 15px;
    margin-right:10px;
}

#output{
    margin-top:20px;
    border-top:1px solid #ddd;
    padding-top:15px;
}
</style>

</head>

<body>

<div class="card">

<h1>Microsoft Sign-In Test v3.01</h1>

<button onclick="signIn()">
    Sign In
</button>

<button onclick="testGraph()">
    Test Graph
</button>
    <button onclick="testCalendar()">
    Calendar
</button>

<p id="status">
    Initializing...
</p>

<div id="output"></div>

</div>

<script>

let pca = null;
let initialized = false;

const msalConfig = {
    auth: {
        clientId: "7a533e96-1dc4-4f59-98ea-2564c7b4d0e1",
        authority: "https://login.microsoftonline.com/common",
        redirectUri: "https://chalmersfamily.github.io/murray-dashboard/auth-test-v3.html"
    }
};

async function startup() {

    try {

        pca = new msal.PublicClientApplication(
            msalConfig
        );

        await pca.initialize();

        initialized = true;

        document.getElementById("status").innerHTML =
            "Ready for sign in";

    }
    catch(err) {

        console.error(err);

        document.getElementById("status").innerHTML =
            "Startup Error:<br>" + err;
    }
}

async function signIn() {

    if(!initialized) {

        document.getElementById("status").innerHTML =
            "Still initializing";

        return;
    }

    try {

        const result =
            await pca.loginPopup({
                scopes: [
                    "openid",
                    "profile",
                    "User.Read"
                ]
            });

        document.getElementById("status").innerHTML =
            "Signed in as:<br>" +
            result.account.username;

    }
    catch(err) {

        console.error(err);

        document.getElementById("status").innerHTML =
            "Login Error:<br>" + err;
    }
}

async function testCalendar() {

    try {

        const accounts = pca.getAllAccounts();

        const tokenResponse =
            await pca.acquireTokenSilent({
                scopes: ["Calendars.Read"],
                account: accounts[0]
            });

        const response =
            await fetch(
                "https://graph.microsoft.com/v1.0/me/events?$top=10&$orderby=start/dateTime",
                {
                    headers: {
                        Authorization:
                            "Bearer " + tokenResponse.accessToken
                    }
                }
            );

        const data = await response.json();

        let html =
            "<h3>Upcoming Events</h3>";

        data.value.forEach(event => {

            html +=
                `<p>
                    <strong>${event.subject}</strong><br>
                    ${event.start.dateTime}
                 </p>`;
        });

        document.getElementById("output").innerHTML =
            html;
    }
    catch(err) {

        console.error(err);

        document.getElementById("output").innerHTML =
            err;
    }
}

startup();

</script>

</body>
</html>
