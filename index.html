<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Murray OS</title>

<style>

:root{
    --bg:#0f172a;
    --card:#1e293b;
    --card-hover:#263548;
    --text:#ffffff;
    --muted:#94a3b8;
    --accent:#38bdf8;
    --success:#22c55e;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:var(--bg);
    color:var(--text);
    font-family:Segoe UI,Arial,sans-serif;
}

h1,h2,h3{
    margin-top:0;
}

.header{
    margin-bottom:25px;
}

.subtitle{
    color:var(--muted);
}

.grid-top{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    margin-bottom:20px;
}

.grid-main{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
    margin-bottom:20px;
}

.grid-bottom{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.card{
    background:var(--card);
    border-radius:18px;
    padding:20px;
    transition:.2s;
}

.card:hover{
    background:var(--card-hover);
}

.summary{
    font-size:42px;
    font-weight:bold;
    color:var(--accent);
}

.status-card{
    border-left:5px solid var(--accent);
}

.task{
    padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.task:last-child{
    border-bottom:none;
}

.calendar-item{
    padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.calendar-item:last-child{
    border-bottom:none;
}

.area-card{
    cursor:pointer;
}

.area-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

.open-link{
    color:var(--accent);
    margin-top:10px;
    font-size:14px;
}

.progress-wrapper{
    height:10px;
    background:#334155;
    border-radius:10px;
    overflow:hidden;
}

.progress{
    width:70%;
    background:var(--success);
    height:10px;
}

.footer{
    margin-top:25px;
    color:var(--muted);
    text-align:center;
}

@media(max-width:900px){

    .grid-main{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="header">

    <h1
