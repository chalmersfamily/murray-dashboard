<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Murray's Plan v1.2</title>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1e293b;
    border-radius:12px;
    padding:20px;
    margin-bottom:15px;
}

.big{
    font-size:36px;
    color:#38bdf8;
    font-weight:bold;
}

.top-row{
    display:flex;
    gap:15px;
    margin-bottom:15px;
}

.top-card{
    flex:1;
    background:#1e293b;
    border-radius:12px;
    padding:15px;
}

.main-row{
    display:flex;
    gap:15px;
    margin-bottom:15px;
}

.tasks-panel{
    flex:2;
}

.calendar-panel{
    flex:1;
}

.bottom-row{
    display:flex;
    gap:15px;
    margin-bottom:15px;
}

.bottom-card{
    flex:1;
    background:#1e293b;
    border-radius:12px;
    padding:15px;
}

.link{
    color:#38bdf8;
    font-weight:bold;
}

.version{
    text-align:center;
    color:#94a3b8;
    font-size:12px;
    margin-top:20px;
}

.subtitle{
    color:#94a3b8;
    margin-top:-10px;
    margin-bottom:20px;
}

button{
    background:#38bdf8;
    color:white;
    border:none;
    border-radius:6px;
    padding:8px 12px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

@media(max-width:768px){

    .top-row,
    .main-row,
    .bottom-row{
        display:block;
    }

    .top-card,
    .bottom-card{
        margin-bottom:15px;
    }

}

</style>
</head>

<body>

<h1>Murray's Plan</h1>

<div class="subtitle">
    Your personal dashboard for today's priorities
</div>

<div class="card">

    <h2>Today's Briefing</h2>

    <p>
        4 tasks remaining • 3 appointments today • 0 overdue items
    </p>

    <p>
        Today looks manageable.
    </p>

</div>

<div class="top-row">

    <div class="top-card">
