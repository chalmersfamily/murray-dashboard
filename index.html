<!DOCTYPE html>
<html>
<head>
<title>Murray OS</title>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}

.card{
    background:#1e293b;
    border-radius:12px;
    padding:20px;
    margin-bottom:15px;
}

.big{
    font-size:40px;
    color:#38bdf8;
    font-weight:bold;
}

.top-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:15px;
}

@media(max-width:800px){
    .top-grid{
        grid-template-columns:1fr 1fr;
    }
}

</style>

</head>

<body>

<h1>Murray OS</h1>

<div class="card">
    <h3>My Day</h3>
    <div class="big">4</div>
    <p>tasks</p>
</div>

<div class="card">
    <h3>Important</h3>
    <div class="big">2</div>
    <p>priority items</p>
</div>

<div class="card">
    <h3>Calendar</h3>
    <div class="big">3</div>
    <p>appointments</p>
</div>

<div class="card">
    <h3>Focus</h3>
    <div class="big">34</div>
    <p>days remaining</p>
</div>
