<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Murray OS</title>

<style>

:root{
    --bg:#0f172a;
    --card:#1e293b;
    --card-hover:#263548;
    --text:#ffffff;
    --muted:#94a3b8;
    --accent:#38bdf8;
    --success:#22c55e;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:var(--bg);
    color:var(--text);
    font-family:Segoe UI,Arial,sans-serif;
}

h1,h2,h3{
    margin-top:0;
}

.header{
    margin-bottom:25px;
}

.subtitle{
    color:var(--muted);
}

.grid-top{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    margin-bottom:20px;
}

.grid-main{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
    margin-bottom:20px;
}

.grid-bottom{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.card{
    background:var(--card);
    border-radius:18px;
    padding:20px;
    transition:.2s;
}

.card:hover{
    background:var(--card-hover);
}

.summary{
    font-size:42px;
    font-weight:bold;
